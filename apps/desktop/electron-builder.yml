appId: dev.superreview.app
productName: Super Review
directories:
  output: release
  buildResources: build
files:
  - out
  - package.json
# Ship the bundled skills' real files so "Configure AI files" can copy them
# straight out of the app instead of writing inlined copies embedded in code.
# They land at <resources>/skills/<name>, unpacked from the asar so they're real
# files on disk (see bundledSkillDir in super-review-skill.ts). Keep the skill
# list in sync with BUNDLED_SKILLS.
extraResources:
  - from: ../../.agents/skills/document-session
    to: skills/document-session
  - from: ../../.agents/skills/resolve-comments
    to: skills/resolve-comments
  - from: ../../.agents/skills/loop-tasks
    to: skills/loop-tasks
extraMetadata:
  main: out/main/index.js
asar: true

# Harden the packaged binary: flip Electron fuses (disable RunAsNode / NODE_
# OPTIONS / --inspect, only load from asar, asar integrity on macOS). Runs
# before signing. See scripts/after-pack.cjs.
afterPack: scripts/after-pack.cjs

# Custom URL scheme for the license activation deep link
# (super-review://activate?code=...). electron-builder writes the macOS
# CFBundleURLTypes and the Windows NSIS registry entries from this.
protocols:
  - name: Super Review
    schemes:
      - super-review

# electron-builder otherwise computes this by scanning node_modules, which is
# unreliable under pnpm's symlinked layout on a clean CI runner and fails with
# "Cannot compute electron version from installed node modules". Pin it — keep
# in sync with the `electron` devDependency in package.json.
electronVersion: 33.4.11

# Where `--publish` uploads artifacts: the private GitHub release. The release
# tag must be `v${version}` (see PUBLISHING.md).
#
# NOTE: installed apps do NOT read updates from here — the repo is private, so
# electron-updater couldn't fetch its assets. The client overrides this feed at
# runtime to the web app's generic proxy (apps/desktop/src/main/updater.ts →
# setFeedURL → <site>/api/update), which serves these same assets with a
# server-side token. This block only governs where the CI build uploads.
publish:
  provider: github
  owner: ieedan
  repo: super-review

# --- Apple silicon (arm64) -------------------------------------------------
# Signing/notarization run only when Apple credentials are present in the env
# (CSC_LINK / CSC_KEY_PASSWORD + APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
# APPLE_TEAM_ID). Without them electron-builder produces an unsigned build.
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    # dmg = manual download; zip = the artifact electron-updater consumes.
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
dmg:
  writeUpdateInfo: false
  # Stable, version-less filename so the docs site can link directly to
  # github.com/.../releases/latest/download/Super-Review-mac-arm64.dmg and always
  # get the newest build. (The updater consumes the zip above, not this dmg.)
  artifactName: Super-Review-mac-arm64.${ext}

# --- Windows (x64) ---------------------------------------------------------
# Code signing runs only when CSC_LINK / CSC_KEY_PASSWORD are set.
win:
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Stable, version-less filename so the docs site can link directly to
  # github.com/.../releases/latest/download/Super-Review-win-x64.exe. electron
  # -updater resolves the installer via latest.yml, so a fixed name is fine.
  artifactName: Super-Review-win-x64.${ext}
