packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  electron: true
  esbuild: true

# Shared versions across the workspace. `svelte` is catalogued so every package
# resolves the exact same copy: two different 5.x patch resolutions produce two
# unrelated `Snippet` types and break `svelte-check`. To test a local checkout of
# sv-agentation, redirect it with a pnpm.overrides "link:" entry in the root
# package.json (catalogs don't support the link: protocol yet).
catalog:
  sv-agentation: ^0.3.1
  svelte: ^5.56.3

# pnpm 10 blocks dependency build scripts unless they're listed here. `electron`
# downloads its binary in a postinstall, and `esbuild` fetches its native binary
# — both are skipped on a clean CI runner without this, producing a broken/empty
# build. (The key is `onlyBuiltDependencies`, a list; `allowBuilds` is not a real
# pnpm field and was silently ignored.)
onlyBuiltDependencies:
  - electron
  - esbuild
  - '@tailwindcss/oxide'
