name: Feedback Triage

# Autonomously triage and (when actionable) fix in-app feedback.
#
# The in-app feedback dialog files GitHub issues tagged `in-app-feedback`.
# This workflow fires the moment that label lands on an issue, spins up a
# Claude Code cloud agent on the runner, and lets it:
#   1. Triage the report — decide whether it's a real, actionable bug/feature
#      it can address, or something that should be sent back for more info.
#   2. If actionable: investigate the monorepo, implement a minimal fix,
#      validate it with the same checks CI runs (lint / typecheck / build),
#      and open a PR that closes the issue.
#   3. Always leave a comment on the issue recording the triage decision
#      (a link to the PR, or why it couldn't act yet).
#
# Auth uses a Claude Code OAuth token (generate with `claude setup-token`)
# stored as the `CLAUDE_CODE_OAUTH_TOKEN` repo secret. GitHub operations use
# the default `GITHUB_TOKEN` the action picks up automatically.
on:
  issues:
    types: [labeled]
  # Manual trigger to test the agent (or re-run triage) against any existing
  # issue without filing real feedback. Pass the issue number.
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to triage'
        required: true
        type: string

jobs:
  triage:
    # React to the `in-app-feedback` label specifically (`github.event.label`
    # is the single label just added, so this won't re-fire when other labels
    # get attached later), or to any manual dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'in-app-feedback'
    runs-on: ubuntu-latest

    # Don't let two events for the same issue run a triage agent concurrently,
    # but never cancel an in-flight run that may be mid-fix.
    concurrency:
      group: feedback-triage-${{ github.event.issue.number || inputs.issue_number }}
      cancel-in-progress: false

    permissions:
      contents: write # create the fix branch and commits
      pull-requests: write # open the fix PR
      issues: write # comment on / label the issue
      id-token: write # OIDC token the action uses

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the agent can branch cleanly and write good diffs.
          fetch-depth: 0

      # Resolve the target issue number for whichever trigger fired. Read the
      # raw values through env vars (never interpolate untrusted input straight
      # into the shell) and emit a single sanitized, digits-only number.
      - name: Resolve issue number
        id: issue
        env:
          EVENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ inputs.issue_number }}
        run: |
          NUM="${EVENT_ISSUE:-$INPUT_ISSUE}"
          if ! [[ "$NUM" =~ ^[0-9]+$ ]]; then
            echo "::error::No valid issue number resolved (got '$NUM')"
            exit 1
          fi
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      # Match the CI toolchain so the agent's validation steps (pnpm lint /
      # typecheck / build) behave exactly like the `check` job in ci.yml.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Triage feedback with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Direct prompt → fully autonomous run (no @claude mention needed).
          # Only the (sanitized) issue number is interpolated in; the agent
          # fetches the title/body/comments itself with `gh`, so the exact same
          # path works for both the label and manual-dispatch triggers — and no
          # untrusted feedback text is interpolated into the workflow.
          prompt: |
            You are triaging in-app user feedback for the Super Review desktop
            app (a pnpm + Node 24 monorepo: `apps/desktop`, `apps/docs`,
            `packages/*`). Triage issue #${{ steps.issue.outputs.number }}.

            First read the full report and its discussion:
              gh issue view ${{ steps.issue.outputs.number }} --comments

            ## Step 1 — Triage
            Decide whether this feedback is actionable: a concrete bug or a
            small, well-scoped feature/UX fix you can confidently implement and
            verify in this repo right now.

            NOT actionable (do NOT open a PR) when the report is too vague to
            reproduce, is a question or general comment, is spam, duplicates an
            existing open issue, or would require a large/risky design decision
            or product call. In that case:
              - Post ONE comment on the issue explaining the triage outcome and,
                if it's just missing detail, exactly what you'd need to proceed.
              - Do not change code. Stop here.

            ## Step 2 — Fix (only if actionable)
            - Create a branch named `feedback/issue-${{ steps.issue.outputs.number }}`.
            - Implement the smallest correct change that resolves the feedback.
              Match the surrounding code's style and conventions, and follow the
              repo's CLAUDE.md / AGENTS.md guidance (e.g. native context menus).
            - Validate before opening the PR, fixing anything you break:
                pnpm lint
                pnpm typecheck
                pnpm build
            - Open a PR with `gh`:
                - Base branch: main
                - A Conventional Commits title (`fix:`, `feat:`, etc.).
                - A body that summarizes the change, explains the fix, notes how
                  you validated it, and ends with `Closes #${{ steps.issue.outputs.number }}`.
                - Mention that it was generated automatically from in-app feedback.
                - Link the issue that triggered the PR.

          # Tools the agent needs: shell (git/gh/pnpm), code search, and edits.
          claude_args: |
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,MultiEdit,TodoWrite"
