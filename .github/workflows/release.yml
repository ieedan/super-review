name: Release

# Changesets-driven autorelease. On every push to `main`:
#   1. `version` runs changesets/action — it opens/updates a "Version Packages"
#      PR while changesets are pending, and once that PR merges (no changesets
#      left) it (a) publishes the `super-review` CLI to npm via `pnpm ci:release`
#      and (b) decides whether the freshly-bumped desktop version needs releasing.
#   2. `build` packages the desktop app on macOS arm64 + Windows x64 via
#      electron-builder (`pnpm release`, --publish always), producing a *draft*
#      GitHub Release with all artifacts.
#   3. `publish-release` pushes the `v<version>` tag at the built commit and
#      flips the draft release to published (so electron-updater sees it).
#
# npm auth for the CLI publish uses a `secrets.NPM_TOKEN` (an npm automation/
# granular token) wired in as NODE_AUTH_TOKEN. setup-node's registry-url writes
# the .npmrc that consumes it. (Provenance via OIDC would be nicer but requires
# a public source repo — switch to it once this repo is public.)
# See PUBLISHING.md for the contributor-facing walkthrough.
on:
  push:
    branches: [main]
  # Manual re-run against the current main commit.
  workflow_dispatch:

# Don't let two pushes race the Version PR / a release.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  # create/upload the GitHub Release and push the version tag
  contents: write
  # changesets/action opens the "Version Packages" PR
  pull-requests: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags so changesets can build changelogs and the
          # release gate below can see existing version tags.
          fetch-depth: 0
          # changesets/action sets its own git credentials; leaving checkout's
          # persisted http.extraheader in place causes "Duplicate header:
          # Authorization" on push (actions/checkout#2299).
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          # Writes an .npmrc that authenticates via NODE_AUTH_TOKEN (set below).
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # While changesets are pending, this opens/updates the "Version Packages"
      # PR. Once that PR merges (no changesets left), it instead runs the
      # `publish` command, which publishes the `super-review` CLI to npm. The
      # private desktop/docs/core packages are skipped by `changeset publish`.
      - name: Create Version PR / publish CLI
        id: changesets
        uses: changesets/action@v2.0.0-next.2
        with:
          version: pnpm changeset:version
          publish: pnpm ci:release
          commit: 'chore(release): version desktop app'
          title: 'chore(release): version desktop app'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # npm automation/granular token with publish rights for `super-review`.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Runs only when there are no pending changesets — i.e. nothing to PR.
      # That's either a routine push (version already tagged → skip) or a just
      # -merged Version PR (new, un-tagged version → release).
      - name: Decide whether to release
        id: check
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already tagged — nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION is not yet released — building"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon (arm64) — macos-14 runners are arm64.
          - os: macos-14
            name: macOS (Apple silicon)
          # Windows x64.
          - os: windows-latest
            name: Windows (x64)
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & publish
        working-directory: apps/desktop
        # bash on every runner (Git Bash on Windows) so the signing guard below
        # is portable.
        shell: bash
        env:
          # Token electron-builder uses to create/upload the GitHub Release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Raw per-OS signing secrets. Promoted to the generic CSC_LINK /
          # CSC_KEY_PASSWORD in the run script below — but only when present.
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

          # macOS notarization (used only when the build above is signed).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Code signing is optional. electron-builder treats a defined-but-EMPTY
        # CSC_LINK as "a certificate was provided" and then dies resolving it
        # ("<projectDir> not a file"), so we must never export an empty CSC_LINK.
        # Promote the per-OS secret only when it's actually set; otherwise disable
        # signing so the runner produces a clean unsigned build.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            CERT="$MAC_CSC_LINK"; CERT_PW="$MAC_CSC_KEY_PASSWORD"
          else
            CERT="$WIN_CSC_LINK"; CERT_PW="$WIN_CSC_KEY_PASSWORD"
          fi
          if [ -n "$CERT" ]; then
            echo "Code signing enabled for $RUNNER_OS"
            export CSC_LINK="$CERT" CSC_KEY_PASSWORD="$CERT_PW"
          else
            echo "No certificate for $RUNNER_OS — building unsigned"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm run release

  publish-release:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag and publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          V="v$VERSION"
          # Tag the exact commit that was built (the run's triggering SHA).
          git tag "$V" "${{ github.sha }}"
          git push origin "$V"
          # Pull this version's section out of the changesets-generated
          # changelog (everything between "## <version>" and the next "## ")
          # so the release body shows the notes + PR links instead of being
          # blank. electron-builder leaves the draft body empty.
          awk -v ver="## $VERSION" '
            $0 == ver {flag=1; next}
            /^## / && flag {exit}
            flag {print}
          ' apps/desktop/CHANGELOG.md > release-notes.md
          # electron-builder uploads to a *draft* release; add the notes and
          # flip it live so electron-updater can resolve it.
          TITLE="Super Review Desktop@$VERSION"
          if [ -s release-notes.md ]; then
            gh release edit "$V" --title "$TITLE" --notes-file release-notes.md --draft=false --latest
          else
            echo "No changelog section found for $VERSION — publishing without notes"
            gh release edit "$V" --title "$TITLE" --draft=false --latest
          fi
