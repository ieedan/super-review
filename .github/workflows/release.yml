name: Release

# Changesets-driven autorelease. On every push to `main`:
#   1. `version` runs changesets/action — it opens/updates a "Version Packages"
#      PR while changesets are pending, and once that PR merges (no changesets
#      left) decides whether the freshly-bumped version needs releasing.
#   2. `build` packages the desktop app on macOS arm64 + Windows x64 via
#      electron-builder (`pnpm release`, --publish always), producing a *draft*
#      GitHub Release with all artifacts.
#   3. `publish-release` pushes the `v<version>` tag at the built commit and
#      flips the draft release to published (so electron-updater sees it).
# See PUBLISHING.md for the contributor-facing walkthrough.
on:
  push:
    branches: [main]
  # Manual re-run against the current main commit.
  workflow_dispatch:

# Don't let two pushes race the Version PR / a release.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  # create/upload the GitHub Release and push the version tag
  contents: write
  # changesets/action opens the "Version Packages" PR
  pull-requests: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so changesets can build changelogs and the
          # release gate below can see existing version tags.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Version PR / version packages
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          commit: 'chore(release): version desktop app'
          title: 'chore(release): version desktop app'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runs only when there are no pending changesets — i.e. nothing to PR.
      # That's either a routine push (version already tagged → skip) or a just
      # -merged Version PR (new, un-tagged version → release).
      - name: Decide whether to release
        id: check
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already tagged — nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION is not yet released — building"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon (arm64) — macos-14 runners are arm64.
          - os: macos-14
            name: macOS (Apple silicon)
          # Windows x64.
          - os: windows-latest
            name: Windows (x64)
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & publish
        working-directory: apps/desktop
        run: pnpm run release
        env:
          # Token electron-builder uses to create/upload the GitHub Release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Code signing is optional. With no secrets set these resolve to empty
          # and electron-builder produces an unsigned build. Per-OS expressions
          # keep the macOS certificate off the Windows runner and vice versa.
          # electron-builder reads CSC_LINK / CSC_KEY_PASSWORD generically on
          # both platforms.
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || (runner.os == 'Windows' && secrets.WIN_CSC_LINK || '') }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || (runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '') }}

          # macOS notarization (used only when the build above is signed).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish-release:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v${{ needs.version.outputs.version }}"
          # Tag the exact commit that was built (the run's triggering SHA).
          git tag "$V" "${{ github.sha }}"
          git push origin "$V"
          # electron-builder uploads to a *draft* release; flip it live so
          # electron-updater can resolve it.
          gh release edit "$V" --draft=false --latest
