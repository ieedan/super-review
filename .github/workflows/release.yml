name: Release

# Changesets-driven autorelease. On every push to `main`:
#   1. `version` runs changesets/action — it opens/updates a "Version Packages"
#      PR while changesets are pending, and once that PR merges (no changesets
#      left) it (a) publishes the `super-review` CLI to npm via `pnpm ci:release`
#      and (b) decides whether the freshly-bumped desktop version needs releasing.
#   2. `build` packages the desktop app on macOS arm64 + Windows x64 via
#      electron-builder (`pnpm release`, --publish always), producing a *draft*
#      GitHub Release with all artifacts.
#   3. `publish-release` pushes the `v<version>` tag at the built commit and
#      flips the draft release to published (so electron-updater sees it).
#
# The CLI publish uses npm trusted publishing (OIDC): the `version` job has
# `id-token: write` and npm exchanges the GitHub OIDC token for a short-lived
# publish credential, so no npm token secret exists. Provenance attestations
# are generated automatically. This needs npm >= 11.5.1 and a trusted publisher
# configured for `super-review` on npmjs.com (repo ieedan/super-review,
# workflow `release.yml`). Don't set `registry-url` on setup-node: it writes an
# .npmrc that expects NODE_AUTH_TOKEN and gets in the way of the OIDC exchange.
on:
  push:
    branches: [main]
  # Manual re-run against the current main commit.
  workflow_dispatch:

# Don't let two pushes race the Version PR / a release.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  # create/upload the GitHub Release and push the version tag
  contents: write
  # changesets/action opens the "Version Packages" PR
  pull-requests: write

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      # create/upload the GitHub Release and push the version tag
      contents: write
      # changesets/action opens the "Version Packages" PR
      pull-requests: write
      # npm trusted publishing (OIDC) + provenance
      id-token: write
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history + tags so changesets can build changelogs and the
          # release gate below can see existing version tags.
          fetch-depth: 0
          # changesets/action sets its own git credentials; leaving checkout's
          # persisted http.extraheader in place causes "Duplicate header:
          # Authorization" on push (actions/checkout#2299).
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Trusted publishing requires npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # While changesets are pending, this opens/updates the "Version Packages"
      # PR. Once that PR merges (no changesets left), it instead runs the
      # `publish` command, which publishes the `super-review` CLI to npm. The
      # private desktop/web/core packages are skipped by `changeset publish`.
      - name: Create Version PR / publish CLI
        id: changesets
        uses: changesets/action@v2.0.0-next.2
        with:
          version: pnpm changeset:version
          publish: pnpm ci:release
          commit: 'chore(release): version desktop app'
          title: 'chore(release): version desktop app'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # Runs only when there are no pending changesets — i.e. nothing to PR.
      # That's either a routine push (version already tagged → skip) or a just
      # -merged Version PR (new, un-tagged version → release).
      - name: Decide whether to release
        id: check
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already tagged — nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION is not yet released — building"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

  # Create the draft release ONCE, before the matrix builds fan out. Without
  # this, the two `electron-builder --publish always` jobs race: each calls
  # electron-publish's getOrCreateRelease, which reuses an existing *draft*
  # whose tag matches but only if it already exists. The jobs start seconds
  # apart and GitHub's `GET /releases` is eventually consistent, so neither sees
  # the other's just-created draft and BOTH create their own draft for the same
  # tag. publish-release then flips only one live, stranding the other
  # platform's artifacts (mac auto-update 404s on latest-mac.yml). Pre-creating
  # the single draft here (minutes before the builds list releases) makes both
  # jobs find and reuse it, so all artifacts land on one release. A draft
  # release doesn't create the git tag ref, so publish-release still tags +
  # publishes exactly as before.
  prepare-release:
    name: Prepare release
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create draft release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v${{ needs.version.outputs.version }}"
          # Idempotent so a workflow_dispatch re-run against the same version
          # reuses the draft instead of erroring on "release already exists".
          if gh release view "$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $V already exists, reusing"
          else
            gh release create "$V" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "Super Review Desktop@${{ needs.version.outputs.version }}" \
              --notes "Build in progress..."
          fi

  build:
    name: ${{ matrix.name }}
    needs: [version, prepare-release]
    if: needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon (arm64) — macos-14 runners are arm64.
          - os: macos-14
            name: macOS (Apple silicon)
          # Windows x64.
          - os: windows-latest
            name: Windows (x64)
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & publish
        working-directory: apps/desktop
        # bash on every runner (Git Bash on Windows) so the signing guard below
        # is portable.
        shell: bash
        env:
          # Token electron-builder uses to create/upload the GitHub Release.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Raw per-OS signing secrets. Promoted to the generic CSC_LINK /
          # CSC_KEY_PASSWORD in the run script below — but only when present.
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

          # macOS notarization (used only when the build above is signed).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # Code signing is optional. electron-builder treats a defined-but-EMPTY
        # CSC_LINK as "a certificate was provided" and then dies resolving it
        # ("<projectDir> not a file"), so we must never export an empty CSC_LINK.
        # Promote the per-OS secret only when it's actually set; otherwise disable
        # signing so the runner produces a clean unsigned build.
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            CERT="$MAC_CSC_LINK"; CERT_PW="$MAC_CSC_KEY_PASSWORD"
          else
            CERT="$WIN_CSC_LINK"; CERT_PW="$WIN_CSC_KEY_PASSWORD"
          fi
          if [ -n "$CERT" ]; then
            echo "Code signing enabled for $RUNNER_OS"
            export CSC_LINK="$CERT" CSC_KEY_PASSWORD="$CERT_PW"
          else
            echo "No certificate for $RUNNER_OS — building unsigned"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm run release

  publish-release:
    name: Publish release
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag and publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          V="v$VERSION"
          # Tag the exact commit that was built (the run's triggering SHA).
          git tag "$V" "${{ github.sha }}"
          git push origin "$V"
          # Pull this version's section out of the changesets-generated
          # changelog (everything between "## <version>" and the next "## ")
          # so the release body shows the notes + PR links instead of being
          # blank. electron-builder leaves the draft body empty.
          awk -v ver="## $VERSION" '
            $0 == ver {flag=1; next}
            /^## / && flag {exit}
            flag {print}
          ' apps/desktop/CHANGELOG.md > release-notes.md
          # electron-builder uploads to a *draft* release; add the notes and
          # flip it live so electron-updater can resolve it.
          #
          # Do NOT add --prerelease, even while the version carries a `-beta.N`
          # suffix. Both the updater feed and the download page resolve through
          # GitHub's /releases/latest, which skips releases flagged prerelease
          # (see apps/web/src/lib/server/github-releases.ts) — flagging one
          # would strand every installed copy on the last non-prerelease build.
          TITLE="Super Review Desktop@$VERSION"
          if [ -s release-notes.md ]; then
            gh release edit "$V" --title "$TITLE" --notes-file release-notes.md --draft=false --latest
          else
            echo "No changelog section found for $VERSION — publishing without notes"
            gh release edit "$V" --title "$TITLE" --draft=false --latest
          fi
