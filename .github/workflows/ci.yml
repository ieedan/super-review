name: CI

# Lint, type-check, test and build on every PR so a release tag can't be cut
# against a broken tree. This does not package or publish — that's release.yml.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The @super-review/ui browser tests (find/highlighting) run in real
      # Chromium via Playwright; install just that browser + its OS deps.
      - name: Install Playwright Chromium
        run: pnpm --filter @super-review/ui exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test
