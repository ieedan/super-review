name: CI

# Lint, type-check, test and build on every PR so a release tag can't be cut
# against a broken tree. This does not package or publish — that's release.yml.
on:
  pull_request:

jobs:
  # Work flows dev -> main: `dev` is the default branch, so PRs land there, and
  # `main` is the release branch (a push to it runs release.yml). Nothing in
  # GitHub's branch protection or rulesets can express "only this branch may
  # open a PR against main", so it is a required check instead.
  base-branch:
    name: Base branch
    runs-on: ubuntu-latest
    steps:
      # Deliberately not a job-level `if`, so the check always reports a real
      # conclusion. PRs into anything other than main pass immediately.
      - name: Check the head branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" != "main" ]; then
            echo "Base is '$BASE', not main. Nothing to enforce."
            exit 0
          fi
          # changesets/action opens the "Version Packages" PR from
          # changeset-release/main against main, so that one is allowed too.
          case "$HEAD" in
            dev|changeset-release/*)
              echo "'$HEAD' -> main is allowed."
              ;;
            *)
              echo "::error::PRs into main must come from 'dev' (got '$HEAD'). Retarget this PR at dev; main only takes dev and the changesets release branch."
              exit 1
              ;;
          esac

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The @super-review/ui browser tests (find/highlighting) run in real
      # Chromium via Playwright; install just that browser + its OS deps.
      - name: Install Playwright Chromium
        run: pnpm --filter @super-review/ui exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test
