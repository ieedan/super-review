name = "super-review-feedback-uploader"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# The R2 bucket attachments are stored in. Create it first:
#   pnpm wrangler r2 bucket create super-review-feedback
[[r2_buckets]]
binding = "FEEDBACK_BUCKET"
bucket_name = "super-review-feedback"

# Per-IP upload rate limit (sliding window). `period` must be 10 or 60 seconds.
# 30 uploads/minute/IP is generous for a human filing feedback but caps scripted
# abuse and the GitHub-token-verification amplification path. namespace_id is an
# arbitrary id unique to this limiter.
[[ratelimit]]
name = "UPLOAD_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Per-user daily quota counters. Create the namespace, then uncomment with the id
# it prints (the Worker enforces the quota only once this is bound — without it
# uploads still work, just unmetered):
#   npx wrangler kv namespace create FEEDBACK_QUOTA
# [[kv_namespaces]]
# binding = "FEEDBACK_QUOTA"
# id = "<paste-id-from-the-create-command>"

# Optional quota overrides (defaults: 50 files / 250 MB per user per day):
# [vars]
# MAX_FILES_PER_DAY = "50"
# MAX_BYTES_PER_DAY = "262144000"

[vars]
# Public origin returned URLs point at. Leave commented to serve objects through
# this Worker's own GET /feedback/* route. Set it to a custom domain or the
# bucket's r2.dev URL once you've enabled public access. No trailing slash.
# PUBLIC_BASE_URL = "https://feedback.super-review.dev"

# Optional — override the per-file size caps (bytes). Defaults: 10MB / 50MB.
# MAX_IMAGE_BYTES = "10485760"
# MAX_VIDEO_BYTES = "52428800"
